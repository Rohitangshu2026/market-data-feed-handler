<!-- Footer for the Doxygen pages (Doxyfile: HTML_FOOTER). Doxygen prints the
     README's mermaid blocks as plain code; this turns them back into the
     diagrams GitHub shows. Offline, the code stays as it is. -->
<hr class="footer"/><address class="footer"><small>$generatedby doxygen $doxygenversion</small></address>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
if (window.mermaid){
  document.querySelectorAll('div.fragment').forEach(block => {
    const text = [...block.querySelectorAll('div.line')].map(line => line.textContent.trimEnd()).join('\n');
    if (/^(flowchart|sequenceDiagram|classDiagram|stateDiagram-v2)\b/.test(text)){
      const diagram = document.createElement('pre');
      diagram.className = 'mermaid';
      diagram.textContent = text;
      block.replaceWith(diagram);
    }
  });
  mermaid.initialize({ startOnLoad: false });
  mermaid.run();
}
</script>
</body>
</html>
